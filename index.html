<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>British Learner</title>
  <meta name="description" id="metaDescription" content="iGCSE, AS-Level and A-Level programmes for Maths, Physics, Chemistry, Biology and Computer Science with Cambridge, Edexcel and AQA, plus an interactive periodic table.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // The site always follows the browser's light or dark theme.
    (function () {
      var query = matchMedia("(prefers-color-scheme: dark)");
      function apply() { document.documentElement.dataset.theme = query.matches ? "dark" : "light"; }
      apply();
      query.addEventListener("change", apply);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
  <div class="scroll-bar" id="scrollBar" aria-hidden="true"></div>

  <header class="site-header">
    <div class="bl-header">
      <a class="bl-title" href="#/" id="siteTitle">British <span>Learner</span></a>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language / Langue">
        <span class="lang-glider" aria-hidden="true"></span>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
      <nav class="subject-tabs" id="subjectTabs"></nav>
      <div class="future-tabs" id="futureTabs"></div>
    </div>
  </header>

  <div class="program-bar" id="programBar" hidden></div>

  <main class="bl-main" id="view" tabindex="-1"></main>

  <footer class="site-footer">
    <a href="#/" class="footer-logo" aria-label="Turbonix Entertainment"><img src="logo.svg" alt="" width="20" height="20"></a>
    <p><span id="year"></span> Turbonix Entertainment. <span id="rights"></span></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data/curriculum.js?v=7"></script>
  <script src="js/data/curriculum-advanced.js?v=7"></script>
  <script src="js/i18n.js?v=7"></script>
  <script src="js/fx.js?v=7"></script>
  <script src="js/bob.js?v=7"></script>
  <script src="js/periodic.js?v=7"></script>
  <script src="js/lesson.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
